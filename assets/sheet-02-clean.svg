<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">参考图纸2圆领款教学清稿</title>
  <desc id="desc">去除手写笔迹与识别信息后重绘的圆领款前幅、后幅和袖片教学版图。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#dbe5ec" stroke-width="1"/></pattern>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#18324a}.muted{fill:#64788b}.tiny{font-size:15px}.small{font-size:18px}.body{font-size:21px}.label{font-size:17px;font-weight:700}.title{font-size:32px;font-weight:700}.line{fill:none;stroke:#274d63;stroke-width:3;stroke-linejoin:round}.stage{stroke:#b9c8d1;stroke-width:1.5;stroke-dasharray:5 5}.dimension{fill:none;stroke:#b4541b;stroke-width:2}.accent{fill:#b4541b}.panel{fill:#fff;stroke:#9fb2bf;stroke-width:2}.shape{fill:#edf3f6;stroke:#274d63;stroke-width:3;stroke-linejoin:round}.rib{fill:#dce9ef}.confirmed{fill:#e1f3eb;stroke:#2a765c;stroke-width:1.5}.pending{fill:#fff2df;stroke:#b36a25;stroke-width:1.5}.swatch-a{fill:#274d63}.swatch-b{fill:#60748b}.swatch-c{fill:#3e7c75}
    </style>
  </defs>
  <rect width="1200" height="820" fill="#f7fafb"/><rect width="1200" height="820" fill="url(#grid)" opacity=".55"/>
  <rect x="30" y="28" width="1140" height="764" rx="8" class="panel"/>
  <text x="64" y="78" class="title">参考图纸 2 · 圆领款教学清稿</text>
  <text x="64" y="111" class="small muted">去除手写笔迹与识别信息｜保留前幅、后幅、袖片和可辨认教学节点</text>
  <rect x="906" y="50" width="224" height="48" rx="5" class="pending"/><text x="1018" y="81" text-anchor="middle" class="label">非生产吓数 · 待复核</text>

  <g transform="translate(58 148)">
    <rect width="242" height="596" rx="6" class="panel"/>
    <text x="22" y="40" class="label">款式与组织线索</text>
    <path d="M76 108Q121 82 166 108L184 182Q174 240 181 325L156 520H86L61 325Q68 240 58 182Z" fill="#e9eff2" stroke="#274d63" stroke-width="2.5"/>
    <path d="M76 108L28 206L51 224L84 157M166 108l48 98-23 18-33-67" class="line"/>
    <path d="M102 106Q121 128 140 106" class="line"/>
    <path d="M83 150L161 150M74 190L168 190M69 230L173 230M68 270L174 270M68 310L174 310M69 350L173 350M74 390L168 390M79 430L163 430" class="stage"/>
    <text x="121" y="552" text-anchor="middle" class="small">圆领套头款教学示意</text>
    <g transform="translate(26 570)"><rect width="18" height="18" class="swatch-a"/><text x="28" y="15" class="tiny">色纱A</text><rect x="82" width="18" height="18" class="swatch-b"/><text x="110" y="15" class="tiny">色纱B</text><rect x="164" width="18" height="18" class="swatch-c"/><text x="192" y="15" class="tiny">C</text></g>
  </g>

  <g transform="translate(326 148)">
    <rect width="260" height="596" rx="6" class="panel"/><text x="130" y="42" text-anchor="middle" class="title">前幅</text>
    <path d="M50 520V222L76 194L86 106H108Q130 142 152 106H174L184 194L210 222V520Z" class="shape"/>
    <rect x="50" y="486" width="160" height="34" class="rib"/><line x1="50" y1="486" x2="210" y2="486" class="line"/>
    <line x1="50" y1="222" x2="210" y2="222" class="stage"/><line x1="76" y1="194" x2="184" y2="194" class="stage"/>
    <path d="M40 520H220m-12-8 12 8-12 8M52 512l-12 8 12 8" class="dimension"/><text x="130" y="555" text-anchor="middle" class="label accent">开 154 支</text>
