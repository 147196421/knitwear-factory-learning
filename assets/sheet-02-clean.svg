    <path d="M229 520V106m-8 12 8-12 8 12M221 508l8 12 8-12" class="dimension"/><text x="244" y="330" transform="rotate(90 244 330)" text-anchor="middle" class="label accent">衫身约 79 转</text>
    <rect x="32" y="64" width="196" height="34" rx="4" class="confirmed"/><text x="130" y="87" text-anchor="middle" class="tiny">开针与总转数：照片可辨认</text>
    <text x="130" y="584" text-anchor="middle" class="tiny muted">166的具体含义与收针明细待复核</text>
  </g>

  <g transform="translate(612 148)">
    <rect width="260" height="596" rx="6" class="panel"/><text x="130" y="42" text-anchor="middle" class="title">后幅</text>
    <path d="M50 520V222L76 194L86 106H110Q130 120 150 106H174L184 194L210 222V520Z" class="shape"/>
    <rect x="50" y="486" width="160" height="34" class="rib"/><line x1="50" y1="486" x2="210" y2="486" class="line"/>
    <line x1="50" y1="222" x2="210" y2="222" class="stage"/><line x1="76" y1="194" x2="184" y2="194" class="stage"/>
    <path d="M40 520H220m-12-8 12 8-12 8M52 512l-12 8 12 8" class="dimension"/><text x="130" y="555" text-anchor="middle" class="label accent">开 150 支</text>
    <text x="130" y="472" text-anchor="middle" class="label">身段旁见 162 支</text>
    <path d="M229 520V106m-8 12 8-12 8 12M221 508l8 12 8-12" class="dimension"/><text x="244" y="330" transform="rotate(90 244 330)" text-anchor="middle" class="label accent">衫身约 77 转</text>
    <rect x="32" y="64" width="196" height="34" rx="4" class="confirmed"/><text x="130" y="87" text-anchor="middle" class="tiny">开针与总转数：照片可辨认</text>
    <text x="130" y="584" text-anchor="middle" class="tiny muted">162的具体含义与肩领明细待复核</text>
  </g>

  <g transform="translate(898 148)">
    <rect width="244" height="596" rx="6" class="panel"/><text x="122" y="42" text-anchor="middle" class="title">袖片</text>
    <path d="M91 520L48 246L72 204L94 106H150L172 204L196 246L153 520Z" class="shape"/>
    <rect x="91" y="486" width="62" height="34" class="rib"/><line x1="91" y1="486" x2="153" y2="486" class="line"/>
    <line x1="48" y1="246" x2="196" y2="246" class="stage"/><line x1="72" y1="204" x2="172" y2="204" class="stage"/>
    <path d="M82 520H162m-12-8 12 8-12 8M94 512l-12 8 12 8" class="dimension"/><text x="122" y="555" text-anchor="middle" class="label accent">开 55 支</text>
    <path d="M84 94H160m-12-8 12 8-12 8M96 86L84 94l12 8" class="dimension"/><text x="122" y="78" text-anchor="middle" class="label accent">上部约 111 支</text>
    <path d="M211 520V106m-8 12 8-12 8 12M203 508l8 12 8-12" class="dimension"/><text x="226" y="330" transform="rotate(90 226 330)" text-anchor="middle" class="label accent">袖身约 73 转</text>
    <text x="122" y="584" text-anchor="middle" class="tiny muted">袖身加针与袖山分组：待复核</text>
  </g>

  <text x="600" y="778" text-anchor="middle" class="small muted">教学重绘：数值只采用照片较清楚部分，模糊内容统一标为待复核</text>
</svg>
